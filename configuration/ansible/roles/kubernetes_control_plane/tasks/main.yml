---
- name: Render kubeadm control-plane configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    owner: root
    group: root
    mode: "0600"

- name: Initialize the Kubernetes control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config=/etc/kubernetes/kubeadm-init.yaml
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init
  no_log: true

- name: Create kubectl directory for the admin user
  ansible.builtin.file:
    path: "{{ kubernetes_admin_home }}/.kube"
    state: directory
    owner: "{{ kubernetes_admin_user }}"
    group: "{{ kubernetes_admin_group }}"
    mode: "0700"

- name: Install kubeconfig for the admin user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubernetes_admin_home }}/.kube/config"
    remote_src: true
    owner: "{{ kubernetes_admin_user }}"
    group: "{{ kubernetes_admin_group }}"
    mode: "0600"

- name: Fetch admin kubeconfig to the controller
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../artifacts/admin.conf"
    flat: true
  no_log: true
