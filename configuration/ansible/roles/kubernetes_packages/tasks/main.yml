---
- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "{{ kubernetes_apt_key_url }}"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Configure Kubernetes package repository
  ansible.builtin.apt_repository:
    repo: "{{ kubernetes_apt_repository }}"
    filename: kubernetes
    state: present
    update_cache: true

- name: Install Kubernetes node packages
  ansible.builtin.apt:
    name: "{{ kubernetes_packages }}"
    state: present
  when: not ansible_check_mode

- name: Hold Kubernetes packages at their installed versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages }}"
  when: not ansible_check_mode

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
  when: not ansible_check_mode
