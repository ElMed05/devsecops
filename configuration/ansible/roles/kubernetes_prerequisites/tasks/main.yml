---
- name: Install Kubernetes host prerequisites
  ansible.builtin.apt:
    name: "{{ kubernetes_os_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Persist required kernel modules
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/kubernetes.conf
    line: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ kubernetes_kernel_modules }}"

- name: Load required kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop: "{{ kubernetes_kernel_modules }}"
  changed_when: false

- name: Configure Kubernetes networking sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |-
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"
  notify: Apply Kubernetes sysctl settings

- name: Detect active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: active_swap
  changed_when: false
  check_mode: false

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: active_swap.stdout | trim | length > 0
  changed_when: true

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(\S+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
